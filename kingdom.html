<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>骑马与砍杀2 - 百科全书 - 王国 - {kingdom.name}</title>
  <link rel="icon" href="https://rebang.open2hub.com/open2hub.ico" type="image/x-icon" sizes="32x32">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0c0b09;
  font-family: "Microsoft YaHei", "SimHei", sans-serif;
  color: #c8b898;
  overflow: hidden;
}
.game-container {
  width: 100vw; height: 100vh;
  background: linear-gradient(180deg, #1a1712 0%, #12100e 100%);
  display: flex; flex-direction: column;
  border: 2px solid #4a3f2e;
}
.header {
  height: 56px;
  background: linear-gradient(180deg, #3d3428 0%, #2d2620 100%);
  border-bottom: 2px solid #5a4d3a;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.header::after {
  content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1px; background: #8b7355;
}
.nav-arrows {
  position: absolute; left: 16px;
  display: flex; gap: 8px;
}
.arrow {
  width: 0; height: 0; border-style: solid;
}
.arrow.left {
  border-width: 10px 14px 10px 0;
  border-color: transparent #8a7d6b transparent transparent;
}
.arrow.right {
  border-width: 10px 0 10px 14px;
  border-color: transparent transparent transparent #8a7d6b;
}
.header h1 {
  font-size: 24px; color: #e6d2a0;
  letter-spacing: 6px; font-weight: normal;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.header-decor {
  position: absolute;
  width: 200px; height: 32px;
  border: 1px solid #6b5a45;
  border-radius: 16px; top: 12px;
}
.header-decor-left { left: 50%; margin-left: -220px; border-right: none; border-radius: 16px 0 0 16px; }
.header-decor-right { right: 50%; margin-right: -220px; border-left: none; border-radius: 0 16px 16px 0; }
.search-box {
  position: absolute; right: 48px;
  width: 160px; height: 26px;
  background: #1c1814; border: 1px solid #5a4d3a; border-radius: 3px;
}
.search-icon {
  position: absolute; right: 56px;
  color: #8a7d6b; font-size: 14px;
}
.close-btn {
  position: absolute; right: 12px; top: 12px;
  width: 28px; height: 28px;
  border: 2px solid #8a7d6b; border-radius: 50%;
  color: #8a7d6b;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer;
}
.breadcrumb {
  height: 32px;
  background: #1e1a14; border-bottom: 1px solid #3a3228;
  display: flex; align-items: center;
  padding: 0 20px; font-size: 13px; color: #8c7f6b;
}
.breadcrumb span { color: #a09078; }
.breadcrumb .sep { margin: 0 6px; color: #5a5045; }

.main-content {
  flex: 1; display: flex; overflow: hidden;
}
/* 左侧栏 */
.left-panel {
  width: 320px;
  background: #161310;
  border-right: 1px solid #3a3228;
  padding: 24px;
  display: flex; flex-direction: column; align-items: center;
}
.faction-title {
  font-size: 22px; color: #e6d2a0;
  margin-bottom: 20px;
}
.faction-flag-large {
  width: 220px; height: 320px;
  background: #4a2a5a;
  border: 2px solid #6b5a3a;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
}
/* 右侧内容 */
.right-content {
  flex: 1; padding: 24px 32px;
  overflow-y: auto;
}
.desc-text {
  font-size: 14px; line-height: 1.8;
  color: #a09078;
  margin-bottom: 24px;
  max-width: 90%;
}
.section {
  margin-bottom: 24px;
}
.section-title {
  font-size: 18px; color: #d4b97a;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 16px;
  border-bottom: 1px solid #4a3f2e;
  padding-bottom: 6px;
}
.portrait-box {
  display: inline-flex; flex-direction: column; align-items: center;
  gap: 6px;
}
.portrait-img {
  width: 72px; height: 72px;
  background: #2a2218;
  border: 2px solid #6b5a3a;
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
.portrait-img::after {
  content: "👤";
  font-size: 40px;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  opacity: 0.4;
}
.portrait-name {
  font-size: 13px; color: #c8b898;
}
.family-grid {
  display: flex; flex-wrap: wrap;
  gap: 12px;
}
.family-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  width: 80px;
}
.family-crest {
  width: 64px; height: 64px;
  background: #2a2218;
  border: 2px solid #6b5a3a;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
.family-name {
  font-size: 12px; color: #a09078;
  text-align: center;
}
a,
a:link,
a:visited,
a:hover,
a:active {
  text-decoration: none;
  font-size: 13px;
  color: #c8b898;
}
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <h1>百科全书</h1>
  </div>
  <div class="breadcrumb">
    <span><a href="./home.html">首页</a></span> <span class="sep">\</span> <span><a href="./kingdoms.html">王国</a></span> <span class="sep">\</span> <span>{kingdom.name}</span>
  </div>
  <div class="main-content">
    <div class="left-panel">
      <div class="faction-title">{kingdom.name}</div>
      <div class="faction-flag-large"></div>
    </div>
    <div class="right-content">
      <div class="desc-text">
        {kingdom.描述}
      </div>
      <div class="section">
        <div class="section-title">领袖</div>
        {kingdom.ruler}
      </div>
      <div class="section">
        <div class="section-title">家族</div>
        <div class="family-grid">
          {kingdom.clans}
        </div>
      </div>
      <div class="section">
        <div class="section-title">居住点</div>
        <div class="family-grid">
          {kingdom.settlements}
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
