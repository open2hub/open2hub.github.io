<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>百科全书 - 首页</title>
<link rel="icon" href="https://rebang.open2hub.com/open2hub.ico" type="image/x-icon" sizes="32x32">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0c0b09;
  font-family: "Microsoft YaHei", "SimHei", sans-serif;
  color: #c8b898;
  overflow: hidden;
}
.game-container {
  width: 100vw; height: 100vh;
  background: linear-gradient(180deg, #1a1712 0%, #12100e 100%);
  display: flex; flex-direction: column;
  border: 2px solid #4a3f2e;
}
/* 顶部标题栏 */
.header {
  height: 56px;
  background: linear-gradient(180deg, #3d3428 0%, #2d2620 100%);
  border-bottom: 2px solid #5a4d3a;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.header::after {
  content: "";
  position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1px; background: #8b7355;
}
.nav-arrows {
  position: absolute; left: 16px;
  display: flex; gap: 8px;
}
.arrow {
  width: 0; height: 0;
  border-style: solid;
}
.arrow.left {
  border-width: 10px 14px 10px 0;
  border-color: transparent #8a7d6b transparent transparent;
}
.arrow.right {
  border-width: 10px 0 10px 14px;
  border-color: transparent transparent transparent #8a7d6b;
}
.header h1 {
  font-size: 24px;
  color: #e6d2a0;
  letter-spacing: 6px;
  font-weight: normal;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.header-decor {
  position: absolute;
  width: 200px; height: 32px;
  border: 1px solid #6b5a45;
  border-radius: 16px;
  top: 12px;
}
.header-decor-left { left: 50%; margin-left: -220px; border-right: none; border-radius: 16px 0 0 16px; }
.header-decor-right { right: 50%; margin-right: -220px; border-left: none; border-radius: 0 16px 16px 0; }
.search-box {
  position: absolute; right: 48px;
  width: 160px; height: 26px;
  background: #1c1814;
  border: 1px solid #5a4d3a;
  border-radius: 3px;
}
.search-icon {
  position: absolute; right: 56px;
  color: #8a7d6b; font-size: 14px;
}
.close-btn {
  position: absolute; right: 12px; top: 12px;
  width: 28px; height: 28px;
  border: 2px solid #8a7d6b;
  border-radius: 50%;
  color: #8a7d6b;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer;
}
/* 面包屑 */
.breadcrumb {
  height: 32px;
  background: #1e1a14;
  border-bottom: 1px solid #3a3228;
  display: flex; align-items: center;
  padding: 0 20px;
  font-size: 13px;
  color: #8c7f6b;
}
.breadcrumb span { color: #a09078; }
.breadcrumb .sep { margin: 0 6px; color: #5a5045; }
/* 主内容 */
.main-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  gap: 12px;
}
/* 卡片样式 - 同时适用于 a 标签和原始 div，确保外观完全一致 */
.card {
  display: flex;
  flex-direction: column;
  width: 13%;
  height: 78%;
  min-height: 420px;
  background: #1e1a14;
  border: 2px solid #6b5a3a;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s;
  text-decoration: none;
  color: inherit;
}
.card:hover { border-color: #a08050; }
.card-img {
  flex: 1;
  background-size: cover;
  background-position: center;
  position: relative;
}
.card-title {
  height: 40px;
  background: linear-gradient(180deg, rgba(30,26,20,0.9) 0%, #1e1a14 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: #e6d2a0;
  border-top: 1px solid #4a3f2e;
  letter-spacing: 2px;
}
/* 各卡片背景模拟 - 完全保留原有装饰 */
.card:nth-child(1) .card-img {
  background: linear-gradient(180deg, #87CEEB 0%, #5a8a5a 40%, #8b7355 100%);
}
.card:nth-child(1) .card-img::before {
  content: "";
  position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(180deg, transparent 0%, #5a4a35 100%);
}
.card:nth-child(1) .card-img::after {
  content: "🏘";
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  font-size: 60px; opacity: 0.3;
}
.card:nth-child(2) .card-img {
  background: linear-gradient(180deg, #4a6fa5 0%, #2a3a2a 100%);
}
.card:nth-child(2) .card-img::after {
  content: "🐴";
  position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
  font-size: 70px; opacity: 0.25;
}
.card:nth-child(3) .card-img {
  background: linear-gradient(180deg, #87CEEB 0%, #5a7a8a 50%, #4a5a6a 100%);
}
.card:nth-child(3) .card-img::after {
  content: "⛵";
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  font-size: 60px; opacity: 0.3;
}
.card:nth-child(4) .card-img {
  background: linear-gradient(180deg, #6a7a6a 0%, #4a4a4a 50%, #3a3a3a 100%);
}
.card:nth-child(4) .card-img::after {
  content: "⚔";
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  font-size: 60px; opacity: 0.25;
}
.card:nth-child(5) .card-img {
  background: linear-gradient(180deg, #8a3a3a 0%, #5a2a2a 100%);
}
.card:nth-child(5) .card-img::after {
  content: "👑";
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  font-size: 60px; opacity: 0.25;
}
.card:nth-child(6) .card-img {
  background: linear-gradient(180deg, #7a4a3a 0%, #4a3a2a 100%);
}
.card:nth-child(6) .card-img::after {
  content: "🛡";
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  font-size: 60px; opacity: 0.25;
}
.card:nth-child(7) .card-img {
  background: linear-gradient(180deg, #5a6a5a 0%, #3a4a3a 100%);
}
.card:nth-child(7) .card-img::after {
  content: "📜";
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  font-size: 60px; opacity: 0.25;
}
/* 重置a标签默认样式，完全继承卡片色彩，无下划线无额外背景 */
a,
a:link,
a:visited,
a:hover,
a:active {
  text-decoration: none;
  font-size: 18px;
  color: #e6d2a0;
}
/* 保证a标签作为卡片时的交互与视觉完全一致，无额外轮廓 */
a.card {
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
a.card:focus-visible {
  outline: 1px solid #a08050;
}
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <h1>百科全书</h1>
  </div>
  <div class="breadcrumb">
    <span>首页</span>
  </div>
  <div class="main-content">
    <a class="card" href="javascript:void(0)">
      <div class="card-img"></div>
      <div class="card-title">定居点</div>
    </a>
    <a class="card" href="javascript:void(0)">
      <div class="card-img"></div>
      <div class="card-title">角色</div>
    </a>
    <a class="card" href="javascript:void(0)">
      <div class="card-img"></div>
      <div class="card-title">舰船</div>
    </a>
    <a class="card" href="javascript:void(0)">
      <div class="card-img"></div>
      <div class="card-title">士兵</div>
    </a>
    <a class="card" href="./kingdoms.html">
      <div class="card-img"></div>
      <div class="card-title">王国</div>
    </a>
    <a class="card" href="javascript:void(0)">
      <div class="card-img"></div>
      <div class="card-title">家族</div>
    </a>
    <a class="card" href="javascript:void(0)">
      <div class="card-img"></div>
      <div class="card-title">术语</div>
    </a>
  </div>
</div>
</body>
</html>
