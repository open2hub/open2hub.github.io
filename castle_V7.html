<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>骑马与砍杀2 - 百科全书 - 定居点 - 塔利维尔堡</title>
  <link rel="icon" href="https://rebang.open2hub.com/open2hub.ico" type="image/x-icon" sizes="32x32">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0c0b09;
  font-family: "Microsoft YaHei", "SimHei", sans-serif;
  color: #c8b898;
  overflow: hidden;
}
.game-container {
  width: 100vw; height: 100vh;
  background: linear-gradient(180deg, #1a1712 0%, #12100e 100%);
  display: flex; flex-direction: column;
  border: 2px solid #4a3f2e;
}
.header {
  height: 56px;
  background: linear-gradient(180deg, #3d3428 0%, #2d2620 100%);
  border-bottom: 2px solid #5a4d3a;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.header::after {
  content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1px; background: #8b7355;
}
.nav-arrows {
  position: absolute; left: 16px;
  display: flex; gap: 8px;
}
.arrow {
  width: 0; height: 0; border-style: solid;
}
.arrow.left {
  border-width: 10px 14px 10px 0;
  border-color: transparent #8a7d6b transparent transparent;
}
.arrow.right {
  border-width: 10px 0 10px 14px;
  border-color: transparent transparent transparent #8a7d6b;
}
.header h1 {
  font-size: 24px; color: #e6d2a0;
  letter-spacing: 6px; font-weight: normal;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.header-decor {
  position: absolute;
  width: 200px; height: 32px;
  border: 1px solid #6b5a45;
  border-radius: 16px; top: 12px;
}
.header-decor-left { left: 50%; margin-left: -220px; border-right: none; border-radius: 16px 0 0 16px; }
.header-decor-right { right: 50%; margin-right: -220px; border-left: none; border-radius: 0 16px 16px 0; }
.search-box {
  position: absolute; right: 48px;
  width: 160px; height: 26px;
  background: #1c1814; border: 1px solid #5a4d3a; border-radius: 3px;
}
.search-icon {
  position: absolute; right: 56px;
  color: #8a7d6b; font-size: 14px;
}
.close-btn {
  position: absolute; right: 12px; top: 12px;
  width: 28px; height: 28px;
  border: 2px solid #8a7d6b; border-radius: 50%;
  color: #8a7d6b;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer;
}
.breadcrumb {
  height: 32px;
  background: #1e1a14; border-bottom: 1px solid #3a3228;
  display: flex; align-items: center;
  padding: 0 20px; font-size: 13px; color: #8c7f6b;
}
.breadcrumb span { color: #a09078; }
.breadcrumb .sep { margin: 0 6px; color: #5a5045; }

.main-content {
  flex: 1; display: flex; overflow: hidden;
}
/* 左侧栏 */
.left-panel {
  width: 320px;
  background: #161310;
  border-right: 1px solid #3a3228;
  padding: 24px;
  display: flex; flex-direction: column;
}
.star-icon {
  align-self: flex-start;
  font-size: 20px; color: #a08050;
  margin-bottom: 8px;
}
.settle-title {
  font-size: 22px; color: #e6d2a0;
  margin-bottom: 16px;
}
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.stat-item {
  display: flex; align-items: center;
  gap: 8px; font-size: 15px;
}
.stat-icon {
  width: 80px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.stat-val { color: #e6d2a0; }
.stat-label { color: #8c7f6b; font-size: 13px; }
.culture-row {
  display: flex; align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 14px;
}
.culture-label { color: #a09078; }
.culture-val { color: #e6d2a0; }
.settle-img {
  width: 260px; height: 340px;
  border: 2px solid #6b5a3a;
  position: relative;
  overflow: hidden;
}
.settle-img::before {
  content: "";
  position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, transparent 0%, #3a3228 100%);
}
.settle-img::after {
  font-size: 80px;
  position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
  opacity: 0.4;
}
/* 右侧内容 */
.right-content {
  flex: 1; padding: 24px 32px;
  overflow-y: auto;
  position: relative;
}
.desc-text {
  font-size: 14px; line-height: 1.8;
  color: #a09078;
  margin-bottom: 24px;
  max-width: 85%;
}
.section {
  margin-bottom: 24px;
}
.section-title {
  font-size: 18px; color: #d4b97a;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px;
  border-bottom: 1px solid #4a3f2e;
  padding-bottom: 6px;
}
.owner-box {
  display: flex; align-items: center;
  gap: 20px;
}
.owner-portrait {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
}
.owner-img {
  width: 72px; height: 72px;
  background: #2a2218;
  border: 2px solid #6b5a3a;
  border-radius: 3px;
  position: relative;
}
.owner-img::after {
  content: "👤";
  font-size: 40px;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  opacity: 0.4;
}
.owner-name {
  font-size: 13px; color: #c8b898;
}
.owner-crest {
  width: 72px; height: 72px;
  background: #4a2a5a;
  border: 2px solid #6b5a3a;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.owner-crest-name {
  font-size: 13px; color: #c8b898;
  margin-top: 4px;
}
.portraits-grid {
  display: flex; flex-wrap: wrap;
  gap: 10px;
}
.portrait-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  width: 80px;
}
.portrait-img {
  width: 64px; height: 64px;
  background: #2a2218;
  border: 2px solid #6b5a3a;
  border-radius: 3px;
  position: relative;
}
.portrait-img::after {
  content: "👤";
  font-size: 32px;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  opacity: 0.3;
}
.portrait-name {
  font-size: 12px; color: #a09078;
  text-align: center;
}
.settlements-grid {
  display: flex; flex-wrap: wrap;
  gap: 12px;
}
.settlement-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  width: 100px;
}
.settlement-img {
  width: 90px; height: 70px;
  background: #2a2218;
  border: 2px solid #6b5a3a;
  border-radius: 3px;
  position: relative;
}
.settlement-img::after {
  content: "🏘";
  font-size: 36px;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  opacity: 0.3;
}
.settlement-name {
  font-size: 12px; color: #a09078;
  text-align: center;
}
.portrait-box {
  display: inline-flex; flex-direction: column; align-items: center;
  gap: 6px;
}
.portrait-img {
  width: 72px; height: 72px;
  background: #2a2218;
  border: 2px solid #6b5a3a;
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
.portrait-img::after {
  content: "👤";
  font-size: 40px;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  opacity: 0.4;
}
.portrait-name {
  font-size: 13px; color: #c8b898;
}
.family-grid {
  display: flex; flex-wrap: wrap;
  gap: 12px;
}
a,
a:link,
a:visited,
a:hover,
a:active {
  text-decoration: none;
  font-size: 13px;
  color: #c8b898;
}
</style>
