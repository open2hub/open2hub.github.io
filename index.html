<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>骑马与砍杀2 - 百科全书 - 王国</title>
  <link rel="icon" href="https://rebang.open2hub.com/open2hub.ico" type="image/x-icon" sizes="32x32">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0c0b09;
  font-family: "Microsoft YaHei", "SimHei", sans-serif;
  color: #c8b898;
  overflow: hidden;
}
.game-container {
  width: 100vw; height: 100vh;
  background: linear-gradient(180deg, #1a1712 0%, #12100e 100%);
  display: flex; flex-direction: column;
  border: 2px solid #4a3f2e;
}
.header {
  height: 56px;
  background: linear-gradient(180deg, #3d3428 0%, #2d2620 100%);
  border-bottom: 2px solid #5a4d3a;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.header::after {
  content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1px; background: #8b7355;
}
.nav-arrows {
  position: absolute; left: 16px;
  display: flex; gap: 8px;
}
.arrow {
  width: 0; height: 0; border-style: solid;
}
.arrow.left {
  border-width: 10px 14px 10px 0;
  border-color: transparent #8a7d6b transparent transparent;
}
.arrow.right {
  border-width: 10px 0 10px 14px;
  border-color: transparent transparent transparent #8a7d6b;
}
.header h1 {
  font-size: 24px; color: #e6d2a0;
  letter-spacing: 6px; font-weight: normal;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.header-decor {
  position: absolute;
  width: 200px; height: 32px;
  border: 1px solid #6b5a45;
  border-radius: 16px; top: 12px;
}
.header-decor-left { left: 50%; margin-left: -220px; border-right: none; border-radius: 16px 0 0 16px; }
.header-decor-right { right: 50%; margin-right: -220px; border-left: none; border-radius: 0 16px 16px 0; }
.search-box {
  position: absolute; right: 48px;
  width: 160px; height: 26px;
  background: #1c1814; border: 1px solid #5a4d3a; border-radius: 3px;
}
.search-icon {
  position: absolute; right: 56px;
  color: #8a7d6b; font-size: 14px;
}
.close-btn {
  position: absolute; right: 12px; top: 12px;
  width: 28px; height: 28px;
  border: 2px solid #8a7d6b; border-radius: 50%;
  color: #8a7d6b;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer;
}
.breadcrumb {
  height: 32px;
  background: #1e1a14; border-bottom: 1px solid #3a3228;
  display: flex; align-items: center;
  padding: 0 20px; font-size: 13px; color: #8c7f6b;
}
.breadcrumb span { color: #a09078; }
.breadcrumb .sep { margin: 0 6px; color: #5a5045; }

/* 两栏布局 */
.main-content {
  flex: 1; display: flex; overflow: hidden;
}
.sidebar {
  width: 320px;
  background: #161310;
  border-right: 1px solid #3a3228;
  padding: 20px;
}
.filter-title {
  font-size: 18px; color: #d4b97a;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.filter-title::before {
  content: "▼"; font-size: 12px; color: #a08050;
}
.filter-group label {
  display: flex; align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 15px; color: #b8a88a;
  cursor: pointer;
}
.filter-group input[type="checkbox"] {
  width: 16px; height: 16px;
  border: 1px solid #6b5a3a;
  background: #1e1a14;
  appearance: none;
  position: relative;
}
.filter-group input[type="checkbox"]::after {
  content: "";
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: solid #c8b898;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  display: none;
}
.filter-group input[type="checkbox"]:checked::after { display: block; }

.content {
  flex: 1; padding: 20px 30px;
}
.list-header {
  display: flex; justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
  border-bottom: 1px solid #4a3f2e;
  margin-bottom: 8px;
}
.list-header .col-name {
  font-size: 18px; color: #d4b97a;
  padding-left: 8px;
}
.sort-box {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; color: #a09078;
}
.sort-box select {
  background: #2a2218;
  border: 1px solid #5a4d3a;
  color: #e6d2a0;
  padding: 2px 8px;
  font-size: 14px;
  border-radius: 2px;
}
.list-item {
  padding: 10px 8px;
  font-size: 16px; color: #c8b898;
  border-bottom: 1px solid #2a2218;
  transition: background 0.15s;
}
.list-item:hover {
  background: #1e1a14;
}
a,
a:link,
a:visited,
a:hover,
a:active {
  text-decoration: none;
  color: #a09078;
}
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <h1>百科全书</h1>
  </div>
  <div class="breadcrumb">
    <span><a href="./home.html">首页</a></span> <span class="sep">\</span> <span>王国</span>
  </div>
  <div class="main-content">
    <div class="sidebar">
    </div>
    <div class="content">
      <div class="list-header">
        <div class="col-name">名称</div>
      </div>
      <a href="./empire.html"><div class="list-item">北帝国</div></a>
      <a href="./empire_s.html"><div class="list-item">南帝国</div></a>
      <a href="./battania.html"><div class="list-item">巴旦尼亚</div></a>
      <a href="./khuzait.html"><div class="list-item">库赛特</div></a>
      <a href="./sturgia.html"><div class="list-item">斯特吉亚</div></a>
      <a href="./vlandia.html"><div class="list-item">瓦兰迪亚</div></a>
      <a href="./empire_w.html"><div class="list-item">西帝国</div></a>
      <a href="./nord.html"><div class="list-item">诺德</div></a>
      <a href="./aserai.html"><div class="list-item">阿塞莱</div></a>
    </div>
  </div>
</div>
</body>
</html>
