<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Open2Hub - 极简导航</title>
    <style>
        /* 极简重置 + 现代风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f2f5 0%, #e9eef3 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* 导航容器：干净、居中、弹性换行 */
        .nav-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            max-width: 880px;
            margin: 0 auto;
        }

        /* 每一个导航卡片 —— “一个一个” 独立的块 */
        .nav-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            padding: 0.9rem 1.6rem;
            border-radius: 60px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.02), 0 1px 0 rgba(0, 0, 0, 0.02);
            text-decoration: none;
            font-weight: 510;
            font-size: 1.18rem;
            color: #1a2c3e;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            border: 1px solid rgba(0, 0, 0, 0.04);
            letter-spacing: -0.01em;
            white-space: nowrap;
            cursor: pointer;
        }

        /* 优雅悬停效果，微微抬升 + 更明显的背景 */
        .nav-card:hover {
            transform: translateY(-3px);
            background: #ffffff;
            box-shadow: 0 18px 28px -10px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.08);
            color: #000000;
        }

        /* 点击反馈 */
        .nav-card:active {
            transform: translateY(1px);
            transition-duration: 0.05s;
        }

        /* 图标表情统一大小，与文字和谐 */
        .nav-emoji {
            font-size: 1.35rem;
            line-height: 1;
            filter: drop-shadow(0 1px 0 rgba(0,0,0,0.05));
        }

        /* 链接文字干净利落 */
        .nav-text {
            display: inline-block;
        }

        /* 让移动端更舒适 */
        @media (max-width: 560px) {
            body {
                padding: 1.2rem;
            }
            .nav-grid {
                gap: 1rem;
            }
            .nav-card {
                padding: 0.7rem 1.4rem;
                font-size: 1rem;
                white-space: nowrap;
            }
            .nav-emoji {
                font-size: 1.2rem;
            }
        }

        /* 超窄屏时允许文字折行确保不溢出, 但基本不会 */
        @media (max-width: 420px) {
            .nav-card {
                white-space: normal;
                gap: 0.5rem;
                padding: 0.6rem 1.2rem;
            }
        }

        /* 焦点样式，保证键盘可访问性 */
        .nav-card:focus-visible {
            outline: 3px solid #2c7da0;
            outline-offset: 3px;
            border-radius: 60px;
        }
    </style>
</head>
<body>
    <nav class="nav-grid" aria-label="Open2Hub 快捷导航">
        <a href="https://open2hub.github.io/home.html" class="nav-card" target="_blank" rel="noopener noreferrer">
            <span class="nav-emoji">🐙</span>
            <span class="nav-text">骑马与砍杀2 百科全书</span>
        </a>
    </nav>
</body>
</html>
